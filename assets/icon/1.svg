    <!-- المحفظة (الحجم الأصلي 512×512) -->
    <path d="M100 180 Q100 140 140 140 L372 140 Q412 140 412 180 L412 380 Q412 420 372 420 L140 420 Q100 420 100 380 Z" 
          fill="#FFFFFF"/>
    
    <!-- خط المحفظة الأفقي -->
