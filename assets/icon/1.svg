    <!-- الرسم البياني -->
    <rect x="150" y="320" width="45" height="70" rx="10" fill="#4CAF50"/>
    <rect x="215" y="280" width="45" height="110" rx="10" fill="#FFC107"/>
    <rect x="280" y="240" width="45" height="150" rx="10" fill="#F44336"/>
    
    <!-- السهم الصاعد -->
