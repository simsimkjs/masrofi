name: expense_tracker
description: تطبيق إدارة المصروفات اليومية
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_launcher_icons: ^0.13.1
  # قاعدة البيانات
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  
  # إدارة الحالة
  provider: ^6.1.1

  # التواريخ
  intl: ^0.20.3
  
  # الرسوم البيانية
  fl_chart: ^0.66.0
  
  # الصور
  image_picker: ^1.0.7
  
  # ✅ التصدير
  excel: ^4.0.0
  pdf: ^3.10.8
  printing: ^5.11.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1565C0"  # لون الخلفية (اختياري)
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"  # (اختياري)
  remove_alpha_ios: true  # إزالة الشفافية لـ iOS

  # ✅ الخطوط
  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-Light.ttf
          weight: 300
        - asset: fonts/Cairo-Regular.ttf
          weight: 400
        - asset: fonts/Cairo-Medium.ttf
          weight: 500
        - asset: fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: fonts/Cairo-Bold.ttf
          weight: 700
        - asset: fonts/Cairo-Black.ttf
          weight: 900